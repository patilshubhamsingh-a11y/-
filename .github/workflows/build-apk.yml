name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fix Build File
        run: |
          cat > app/build.gradle.kts <<'GRADLE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.gajananmandir"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.gajananmandir"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildTypes { release { isMinifyEnabled = false } }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.8" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation(platform("androidx.compose:compose-bom:2024.02.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("io.coil-kt:coil-compose:2.5.0")
              implementation("androidx.compose.foundation:foundation")
          }
          GRADLE

      - name: Auto Fix Imports
        run: |
          cat > /tmp/fix.py <<'PY'
          import os
          base="app/src/main/java"
          for r,_,fs in os.walk(base):
            for f in fs:
              if not f.endswith(".kt"): continue
              p=os.path.join(r,f)
              s=open(p,'r',encoding='utf-8',errors='ignore').read()
              o=s
              if "RoundedCornerShape" in s and "foundation.shape" not in s:
                s=s.replace("import androidx.compose.material3", "import androidx.compose.foundation.shape.RoundedCornerShape\nimport androidx.compose.material3")
              if "AsyncImage" in s and "coil.compose" not in s:
                s="import coil.compose.AsyncImage\n"+s
              if "Icons.Filled" in s and "material.icons.Icons" not in s:
                s="import androidx.compose.material.icons.Icons\nimport androidx.compose.material.icons.filled.*\n"+s
              if "BorderStroke" in s and "BorderStroke" not in s:
                s="import androidx.compose.foundation.BorderStroke\n"+s
              if "DailyCardImageGenerator" in p:
                s="package com.example.ui.util\nobject DailyCardImageGenerator { fun getDailyImage(): Int = android.R.drawable.sym_def_app_icon \n fun getImageForDay(d:Int): Int = android.R.drawable.sym_def_app_icon }"
              if s!=o:
                open(p,'w',encoding='utf-8').write(s)
          PY
          python3 /tmp/fix.py

      - name: Build APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
