name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fix ALL files final
        run: |
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              alias(libs.plugins.android.application)
              alias(libs.plugins.kotlin.android)
          }
          android {
              namespace = "com.example.gajananmandir"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.gajananmandir"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildTypes { release { isMinifyEnabled = false } }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.8" }
          }
          dependencies {
              implementation(libs.androidx.core.ktx)
              implementation(libs.androidx.appcompat)
              implementation(libs.material)
              implementation(libs.androidx.activity.compose)
              implementation(platform(libs.androidx.compose.bom))
              implementation(libs.androidx.compose.ui)
              implementation(libs.androidx.compose.material3)
              implementation("androidx.compose.material:material-icons-extended")
          }
          EOF

          cat > app/src/main/java/com/example/ui/screens/LiveDarshanScreen.kt <<'EOF'
          package com.example.ui.screens

          import androidx.compose.foundation.layout.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.dp

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun LiveDarshanScreen() {
              Scaffold(topBar = { TopAppBar(title = { Text("Live Darshan") }) }) { padding ->
                  Column(modifier = Modifier.fillMaxSize().padding(padding).padding(16.dp)) {
                      Card(modifier = Modifier.fillMaxWidth()) {
                          Column(modifier = Modifier.padding(16.dp)) {
                              Text("Live Darshan of Shri Gajanan Maharaj", style = MaterialTheme.typography.titleLarge)
                              Spacer(modifier = Modifier.height(8.dp))
                              Text("Watch live darshan from Shegaon temple.")
                              Spacer(modifier = Modifier.height(12.dp))
                              Button(onClick = {}) {
                                  Text("Watch Live")
                              }
                          }
                      }
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/example/ui/util/DailyCardImageGenerator.kt <<'EOF'
          package com.example.ui.util
          object DailyCardImageGenerator {
              fun getDailyImage(): Int = android.R.drawable.sym_def_app_icon
              fun getImageForDay(day: Int): Int = android.R.drawable.sym_def_app_icon
          }
          EOF

          python3 << 'PY'
          import os, re
          for root, _, files in os.walk("app/src"):
            for fn in files:
              if fn.endswith(".kt"):
                p=os.path.join(root,fn)
                t=open(p,'r',errors='ignore').read()
                orig=t
                t=re.sub(r'import.*RoundedCornerShape.*\n','',t)
                t=re.sub(r'RoundedCornerShape\s*\([^)]*\)','MaterialTheme.shapes.medium',t)
                t=t.replace('RoundedCornerShape','MaterialTheme.shapes.medium')
                # Fix R imports
                if ' R.' in t or '(R.' in t or ' R ' in t:
                  if 'import com.example.gajananmandir.R' not in t and 'import android.R' not in t:
                    t=t.replace('package com.example.ui.screens', 'package com.example.ui.screens\nimport com.example.gajananmandir.R')
                    t=t.replace('package com.example.ui.util', 'package com.example.ui.util\nimport com.example.gajananmandir.R')
                if t!=orig:
                  open(p,'w',encoding='utf-8').write(t)
          PY

      - run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
