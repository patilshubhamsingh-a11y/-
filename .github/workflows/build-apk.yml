name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fix Build and R Imports Properly
        run: |
          cat > app/build.gradle.kts <<'GRADLE'
          plugins {
              alias(libs.plugins.android.application)
              alias(libs.plugins.kotlin.android)
          }
          android {
              namespace = "com.example.gajananmandir"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.gajananmandir"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildTypes { release { isMinifyEnabled = false } }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.8" }
          }
          dependencies {
              implementation(libs.androidx.core.ktx)
              implementation(libs.androidx.appcompat)
              implementation(libs.material)
              implementation(libs.androidx.activity.compose)
              implementation(platform(libs.androidx.compose.bom))
              implementation(libs.androidx.compose.ui)
              implementation(libs.androidx.compose.material3)
              implementation("androidx.compose.material:material-icons-extended")
              implementation("io.coil-kt:coil-compose:2.5.0")
              implementation("androidx.compose.foundation:foundation")
          }
          GRADLE

          python3 << 'PY'
          import os
          base = "app/src/main/java"
          for root, _, files in os.walk(base):
              for f in files:
                  if not f.endswith(".kt"):
                      continue
                  path = os.path.join(root, f)
                  with open(path, 'r', encoding='utf-8', errors='ignore') as file:
                      content = file.read()
                  if "com.example.gajananmandir.R" in content:
                      continue
                  if "R." not in content:
                      continue
                  # package ke baad import add karo
                  if "package" in content:
                      new_content = content.replace("package ", "package ", 1)
                      # first line after package
                      lines = new_content.split("\n")
                      for i, line in enumerate(lines):
                          if line.startswith("package"):
                              lines.insert(i+1, "import com.example.gajananmandir.R")
                              break
                      new_content = "\n".join(lines)
                      with open(path, 'w', encoding='utf-8') as out:
                          out.write(new_content)
                      print(f"Fixed R in {path}")
          PY

      - name: Setup Gradle
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
