name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fix Screens and Build Config
        run: |
          git checkout origin/main -- app/src/main/java/com/example/ui/screens/HomeScreen.kt app/src/main/java/com/example/ui/screens/GalleryScreen.kt app/src/main/java/com/example/ui/screens/LiveDarshanScreen.kt 2>/dev/null || true

          cat > app/src/main/java/com/example/ui/screens/HomeScreen.kt <<'KT'
          package com.example.ui.screens
          import androidx.compose.foundation.layout.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.dp
          @Composable fun HomeScreen(){ Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center){ Column(horizontalAlignment = Alignment.CenterHorizontally){ Text("Gajanan Mandir", style = MaterialTheme.typography.headlineMedium); Spacer(Modifier.height(10.dp)); Text("Welcome to Shegaon") } } }
          KT

          cat > app/src/main/java/com/example/ui/screens/GalleryScreen.kt <<'KT'
          package com.example.ui.screens
          import androidx.compose.foundation.layout.Box
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.material3.Text
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          @Composable fun GalleryScreen(){ Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center){ Text("Gallery Screen") } }
          KT

          cat > app/src/main/java/com/example/ui/screens/LiveDarshanScreen.kt <<'KT'
          package com.example.ui.screens
          import androidx.compose.foundation.layout.Box
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.material3.Text
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          @Composable fun LiveDarshanScreen(){ Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center){ Text("Live Darshan") } }
          KT

          cat > app/build.gradle.kts <<'GRADLE'
          plugins { alias(libs.plugins.android.application); alias(libs.plugins.kotlin.android) }
          android {
              namespace = "com.example.gajananmandir"; compileSdk = 34
              defaultConfig { applicationId = "com.example.gajananmandir"; minSdk = 24; targetSdk = 34; versionCode = 1; versionName = "1.0" }
              buildTypes { release { isMinifyEnabled = false } }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.8" }
          }
          dependencies {
              implementation(libs.androidx.core.ktx); implementation(libs.androidx.appcompat); implementation(libs.material)
              implementation(libs.androidx.activity.compose); implementation(platform(libs.androidx.compose.bom))
              implementation(libs.androidx.compose.ui); implementation(libs.androidx.compose.material3)
          }
          GRADLE
          echo "Fixed screens without R"

      - name: Setup local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gajanan-mandir-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
