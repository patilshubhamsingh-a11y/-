name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fix All Imports and Libraries
        run: |
          cat > app/build.gradle.kts <<'GRADLE'
          plugins { alias(libs.plugins.android.application); alias(libs.plugins.kotlin.android) }
          android {
              namespace = "com.example.gajananmandir"; compileSdk = 34
              defaultConfig { applicationId = "com.example.gajananmandir"; minSdk = 24; targetSdk = 34; versionCode = 1; versionName = "1.0" }
              buildTypes { release { isMinifyEnabled = false } }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.8" }
          }
          dependencies {
              implementation(libs.androidx.core.ktx)
              implementation(libs.androidx.appcompat)
              implementation(libs.material)
              implementation(libs.androidx.activity.compose)
              implementation(platform(libs.androidx.compose.bom))
              implementation(libs.androidx.compose.ui)
              implementation(libs.androidx.compose.material3)
              implementation(libs.androidx.compose.foundation)
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.compose.foundation:foundation")
              implementation("io.coil-kt:coil-compose:2.5.0")
          }
          GRADLE

          python3 << 'PY'
          import os, re
          base = "app/src/main/java"
          for root,_,files in os.walk(base):
              for f in files:
                  if not f.endswith(".kt"): continue
                  path = os.path.join(root,f)
                  with open(path,'r',encoding='utf-8',errors='ignore') as file:
                      txt=file.read()
                  orig=txt

                  # R imports hatao aur safe banao
                  txt = re.sub(r'^import.*\.R.*\n?', '', txt, flags=re.MULTILINE)
                  txt = re.sub(r'com\.example\.gajananmandir\.R\.drawable\.\w+', 'android.R.drawable.ic_menu_gallery', txt)
                  txt = re.sub(r'(?<!android\.)\bR\.drawable\.\w+', 'android.R.drawable.ic_menu_gallery', txt)
                  txt = re.sub(r'(?<!android\.)\bR\.string\.\w+', '"Gajanan Mandir"', txt)
                  txt = re.sub(r'(?<!android\.)\bR\.\w+\.\w+', '0', txt)

                  # Missing imports add karo
                  if 'RoundedCornerShape' in txt and 'RoundedCornerShape' not in txt.split('import')[0]:
                      if 'import androidx.compose.foundation.shape.RoundedCornerShape' not in txt:
                          txt = txt.replace('package ', 'package ', 1)
                          txt = txt.replace('\n', '\nimport androidx.compose.foundation.shape.RoundedCornerShape\n', 1)

                  if 'ChevronRight' in txt and 'ChevronRight' not in txt:
                      pass
                  if 'ChevronRight' in txt and 'import androidx.compose.material.icons.filled.ChevronRight' not in txt:
                      txt = txt.replace('import androidx.compose.material.icons.Icons', 'import androidx.compose.material.icons.Icons\nimport androidx.compose.material.icons.filled.ChevronRight', 1) if 'import androidx.compose.material.icons.Icons' in txt else txt.replace('package ', 'package \nimport androidx.compose.material.icons.Icons\nimport androidx.compose.material.icons.filled.ChevronRight\n', 1)

                  if txt!=orig:
                      with open(path,'w',encoding='utf-8') as out:
                          out.write(txt)
                      print(f"Fixed {path}")
          print("Done")
          PY

      - run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: gajanan-mandir-apk
          path: app/build/outputs/apk/debug/*.apk
