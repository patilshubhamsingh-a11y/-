name: build

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fix R imports
        run: |
          echo "Fixing R imports..."

          find app/src/main/java -name "*.kt" -type f -print0 | while IFS= read -r -d '' file
          do
            sed -i 's/import com\.example\.R/import com.example.gajananmandir.R/g' "$file"
            sed -i 's/com\.example\.R\./com.example.gajananmandir.R./g' "$file"
            echo "Checked: $file"
          done

          echo "R import fix completed."

      - name: Verify app Gradle file
        run: |
          grep -q 'navigation-compose' app/build.gradle.kts
          grep -q 'lifecycle-runtime-compose' app/build.gradle.kts
          grep -q 'media3-exoplayer' app/build.gradle.kts
          echo "Required dependencies are present."

      - name: Set Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Check project
        run: |
          find . -name "*.gradle.kts" -print
          find app/src/main/java -name "*.kt" -print
          find app/src/main/res -maxdepth 2 -type f -print || true

      - name: Clean Build
        run: |
          gradle clean --no-daemon

      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gajanan-mandir-apk
          path: app/build/outputs/apk/debug/*.apk
