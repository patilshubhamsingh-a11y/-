name: build

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. GitHub repository checkout
      - name: Checkout
        uses: actions/checkout@v4


      # 2. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'


      # 3. Fix all R imports
      - name: Fix R imports
        run: |
          echo "Fixing R imports..."

          find app/src/main/java -name "*.kt" -type f -print0 | while IFS= read -r -d '' file
          do
            sed -i 's/import com\.example\.R/import com.example.gajananmandir.R/g' "$file"
            sed -i 's/com\.example\.R\./com.example.gajananmandir.R./g' "$file"

            echo "Checked: $file"
          done

          echo "R import fix completed."


      # 4. Create correct app/build.gradle.kts
      - name: Fix app Gradle file
        run: |
          cat > app/build.gradle.kts <<'EOF'

          plugins {
              alias(libs.plugins.android.application)
              alias(libs.plugins.kotlin.android)
          }

          android {
              namespace = "com.example.gajananmandir"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.gajananmandir"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.8"
              }
          }

          dependencies {
              implementation(libs.androidx.core.ktx)
              implementation(libs.androidx.appcompat)
              implementation(libs.material)
              implementation(libs.androidx.activity.compose)

              implementation(platform(libs.androidx.compose.bom))

              implementation(libs.androidx.compose.ui)
              implementation(libs.androidx.compose.material3)

              implementation("androidx.compose.foundation:foundation:1.6.8")
              implementation("androidx.compose.material:material-icons-extended:1.6.8")
              implementation("io.coil-kt:coil-compose:2.5.0")
          }

          EOF


      # 5. Android SDK
      - name: Set Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties


      # 6. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4


      # 7. Show important project information
      - name: Check project
        run: |
          echo "===== Gradle files ====="
          find . -name "*.gradle.kts" -print

          echo "===== Kotlin files ====="
          find app/src/main/java -name "*.kt" -print

          echo "===== Android resources ====="
          find app/src/main/res -maxdepth 2 -type f -print || true


      # 8. Clean
      - name: Clean Build
        run: |
          gradle clean --no-daemon


      # 9. Build APK
      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon


      # 10. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gajanan-mandir-apk
          path: app/build/outputs/apk/debug/*.apk
