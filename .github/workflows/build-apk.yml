name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Reset And Fix Screens
        run: |
          # 1. Pehle kharab files ko wapas original pe lao
          git checkout origin/main -- app/src/main/java/com/example/ui/screens/HomeScreen.kt app/src/main/java/com/example/ui/screens/GalleryScreen.kt app/src/main/java/com/example/ui/screens/LiveDarshanScreen.kt || true

          # 2. Ab unko simple version se overwrite karo - bina R ke
          mkdir -p app/src/main/java/com/example/ui/screens

          cat > app/src/main/java/com/example/ui/screens/HomeScreen.kt <<'KT'
          package com.example.ui.screens
          import androidx.compose.foundation.layout.Box
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.material3.Text
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          @Composable fun HomeScreen() { Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) { Text("Gajanan Mandir - Home") } }
          KT

          cat > app/src/main/java/com/example/ui/screens/GalleryScreen.kt <<'KT'
          package com.example.ui.screens
          import androidx.compose.foundation.layout.Box
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.material3.Text
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          @Composable fun GalleryScreen() { Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) { Text("Gallery") } }
          KT

          cat > app/src/main/java/com/example/ui/screens/LiveDarshanScreen.kt <<'KT'
          package com.example.ui.screens
          import androidx.compose.foundation.layout.Box
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.material3.Text
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          @Composable fun LiveDarshanScreen() { Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) { Text("Live Darshan") } }
          KT

          # 3. build.gradle sahi karo
          cat > app/build.gradle.kts <<'GRADLE'
          plugins {
              alias(libs.plugins.android.application)
              alias(libs.plugins.kotlin.android)
          }
          android {
              namespace = "com.example.gajananmandir"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.gajananmandir"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildTypes { release { isMinifyEnabled = false } }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.8" }
          }
          dependencies {
              implementation(libs.androidx.core.ktx)
              implementation(libs.androidx.appcompat)
              implementation(libs.material)
              implementation(libs.androidx.activity.compose)
