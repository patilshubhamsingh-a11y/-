name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Force Fix R
        run: |
          cat > app/build.gradle.kts <<'GRADLE'
          plugins {
              alias(libs.plugins.android.application)
              alias(libs.plugins.kotlin.android)
          }
          android {
              namespace = "com.example.gajananmandir"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.gajananmandir"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildTypes { release { isMinifyEnabled = false } }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.8" }
          }
          dependencies {
              implementation(libs.androidx.core.ktx)
              implementation(libs.androidx.appcompat)
              implementation(libs.material)
              implementation(libs.androidx.activity.compose)
              implementation(platform(libs.androidx.compose.bom))
              implementation(libs.androidx.compose.ui)
              implementation(libs.androidx.compose.material3)
              implementation("androidx.compose.material:material-icons-extended")
              implementation("io.coil-kt:coil-compose:2.5.0")
              implementation("androidx.compose.foundation:foundation")
          }
          GRADLE
          for f in $(find app/src/main/java -name "*.kt")
          do
            if! grep -q "gajananmandir.R" "$f"; then
              sed -i '/^package /a import com.example.gajananmandir.R' "$f"
            fi
          done

      - run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
