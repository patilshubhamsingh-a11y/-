name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Restore Original + Fix All
        run: |
          # 1. Pehle tere original wale screens wapas lao (63 number wale commit se)
          git checkout 1b8b059 -- app/src/main/java || git checkout HEAD~3 -- app/src/main/java || echo "restoring from history"

          # 2. Sahi wala build.gradle - saare libs ke saath
          cat > app/build.gradle.kts <<'ENDGRADLE'
          plugins {
              alias(libs.plugins.android.application)
              alias(libs.plugins.kotlin.android)
          }
          android {
              namespace = "com.example.gajananmandir"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.gajananmandir"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildTypes { release { isMinifyEnabled = false } }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.8" }
          }
          dependencies {
              implementation(libs.androidx.core.ktx)
              implementation(libs.androidx.appcompat)
              implementation(libs.material)
              implementation(libs.androidx.activity.compose)
              implementation(platform(libs.androidx.compose.bom))
              implementation(libs.androidx.compose.ui)
              implementation(libs.androidx.compose.material3)
              implementation("androidx.compose.material:material-icons-extended")
              implementation("io.coil-kt:coil-compose:2.5.0")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.ui:ui-tooling-preview")
          }
          ENDGRADLE

          # 3. Saare common errors ko auto-fix
          python3 << 'PY'
          import os, re
          base="app/src/main/java"
          for root,_,files in os.walk(base):
            for fn in files:
              if not fn.endswith(".kt"): continue
              p=os.path.join(root,fn)
              t=open(p,'r',errors='ignore').read()
              orig=t
              # RoundedCornerShape ka import
              if "RoundedCornerShape" in t and "import androidx.compose.foundation.shape.RoundedCornerShape" not in t:
                  t=t.replace("import androidx.compose.material3", "import androidx.compose.foundation.shape.RoundedCornerShape\nimport androidx.compose.material3")
              # AsyncImage ka import
              if "AsyncImage" in t and "coil.compose.AsyncImage" not in t:
                  t=t.replace("package ", "package TEMP\nimport coil.compose.AsyncImage\n",1).replace("package TEMP\n","package ")
                  if "import coil.compose.AsyncImage" not in t:
                      t="import coil.compose.AsyncImage\n"+t
              # Icons ke imports
              if "Icons.Filled" in t and "import androidx.compose.material.icons.Icons" not in t:
                  t="import androidx.compose.material.icons.Icons\n
