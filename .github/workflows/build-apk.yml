name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fix R Issue Permanently
        run: |
          cat > app/build.gradle.kts <<'GRADLE'
          plugins {
              alias(libs.plugins.android.application)
              alias(libs.plugins.kotlin.android)
          }
          android {
              namespace = "com.example.gajananmandir"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.gajananmandir"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildTypes { release { isMinifyEnabled = false } }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.8" }
          }
          dependencies {
              implementation(libs.androidx.core.ktx)
              implementation(libs.androidx.appcompat)
              implementation(libs.material)
              implementation(libs.androidx.activity.compose)
              implementation(platform(libs.androidx.compose.bom))
              implementation(libs.androidx.compose.ui)
              implementation(libs.androidx.compose.material3)
              implementation("androidx.compose.material:material-icons-extended")
              implementation("io.coil-kt:coil-compose:2.5.0")
              implementation("androidx.compose.foundation:foundation")
          }
          GRADLE

          python3 << 'PY'
          import os, re
          base = "app/src/main/java/com/example/ui/screens"
          for fname in os.listdir(base):
              if not fname.endswith(".kt"): continue
              path = os.path.join(base, fname)
              with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                  txt = f.read()
              # Saare R. ke uses ko hatao aur safe value do
              # R.drawable.xxx -> android.R.drawable.ic_menu_gallery
              txt = re.sub(r'com\.example\.gajananmandir\.R\.drawable\.\w+', 'android.R.drawable.ic_menu_gallery', txt)
              txt = re.sub(r'\bR\.drawable\.\w+', 'android.R.drawable.ic_menu_gallery', txt)
              # R.string.xxx -> "Gajanan"
              txt = re.sub(r'com\.example\.gajananmandir\.R\.string\.\w+', '"Gajanan Mandir"', txt)
              txt = re.sub(r'\bR\.string\.\w+', '"Gajanan Mandir"', txt)
              # Bacha hua koi bhi R. -> 0
              txt = re.sub(r'com\.example\.gajananmandir\.R\.\w+\.\w+', '0', txt)
              txt = re.sub(r'\bR\.\w+\.\w+', '0', txt)
              # Akela R bacha ho to hatao
              txt = re.sub(r'\bR\b', '0', txt)

              with open(path, 'w', encoding='utf-8') as out:
                  out.write(txt)
              print(f"Cleaned {fname}")
          PY

      - run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
