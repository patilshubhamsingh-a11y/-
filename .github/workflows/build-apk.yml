name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3

      - name: Fix Keystore and Gradle
        run: |
          rm -f google-services.json app/google-services.json
          rm -f app/debug.keystore
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -validity 10000 -dname "CN=Debug,O=Android,C=US"
          cp ~/.android/debug.keystore app/debug.keystore
          # Fix custom signingConfigs in app/build.gradle.kts
          sed -i "s/signingConfig.*debugConfig/signingConfig signingConfigs.getByName(\"debug\")/g" app/build.gradle.kts || true
          sed -i "s/debugConfig/debug/g" app/build.gradle.kts || true
          echo "Fixed gradle file"

      - name: Build APK
        run: |
          chmod +x gradlew
         ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gajanan-Mandir-APK
          path: app/build/outputs/apk/debug/app-debug.apk
